name: oligostab
channels:
  - bioconda
  - anaconda
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - pytorch
  - pytorch-cuda=12.1
  - torchvision
  - torchaudio
  - torchmetrics
  - pytorch-lightning
  - biopython
  - wandb
  - mmseqs2
  - tqdm
  - pandas
  - numpy
  - omegaconf
  - python==3.12
  - joblib
  - cudatoolkit=11.3
  - pip
  - pip:
    - fair-esm  # Required for sequence embedding extraction
    - lightning-utilities==0.15.2
    - pydantic==2.12.5