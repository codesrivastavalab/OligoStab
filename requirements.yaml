name: oligostab
channels:
  - bioconda
  - anaconda
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python==3.12
  - pytorch-2.5.1
  - pytorch-cuda=12.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - torchmetrics
  - pytorch-lightning
  - biopython
  - wandb
  - mmseqs2
  - tqdm
  - pandas
  - numpy
  - bitsandbytes
  - omegaconf
  - joblib
  - cudatoolkit=11.3
  - pip
  - pip:
    - fair-esm  # Required for sequence embedding extraction
    - transformers==4.57.1
    - huggingface_hub>=0.34,<1.0
    - lightning-utilities==0.15.2
    - pydantic==2.12.5
    - pydantic-core==2.41.5